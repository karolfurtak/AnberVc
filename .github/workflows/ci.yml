name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install fonts DejaVu (raport PDF)
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-dejavu-core

      - name: Install deps
        run: pip install ruff pytest reportlab pillow matplotlib

      - name: AST parse
        run: |
          python -c "import ast; ast.parse(open('app/main.py', encoding='utf-8').read()); print('main.py syntax OK')"
          python -c "import ast; ast.parse(open('vc_lib/core.py', encoding='utf-8').read()); print('core.py syntax OK')"
          python -c "import ast; ast.parse(open('vc_lib/report.py', encoding='utf-8').read()); print('report.py syntax OK')"

      - name: Ruff lint (tylko realne bugi)
        run: ruff check vc_lib/ tests/ --select=E9,F --ignore=F401,F541,F841

      - name: Self-test logiki (bez SDL)
        run: python vc_lib/core.py

      - name: Pytest (dobór obrotów — pełna klasa + brzegi)
        run: pytest -q tests/

      - name: Walidacja struktury GUI (mock — bez uruchamiania SDL)
        run: |
          python -c "
          src = open('app/main.py', encoding='utf-8').read()
          assert 'class VcApp' in src, 'klasa VcApp wymagana'
          assert 'def render' in src and 'def run' in src, 'metody render/run wymagane'
          assert 'ScreenPowerToggle' in src, 'POWER toggle (backlight) wymagany'
          assert 'EXIT_KEYS' in src, 'MENU/MODE exit wymagany'
          assert 'from vc_lib import' in src, 'logika ma byc importowana z vc_lib (testowalnosc)'
          init_lines = [l for l in src.splitlines() if 'SDL_Init(' in l]
          assert init_lines, 'brak wywolania SDL_Init'
          assert not any('JOYSTICK' in l for l in init_lines), 'NIE inicjalizowac joysticka (grabuje event1)'
          assert 'BTN_R2' in src and '_make_report' in src, 'R2 -> raport PDF wymagany'
          assert 'finally:' in src and 'ungrab' in src, 'gwarantowane zwolnienie grabu (try/finally + ungrab) wymagane'
          assert 'ensure_on' in src, 'odzyskanie ekranu na starcie wymagane'
          assert '_apply_saved_config' in src and '_save_config' in src, 'persystencja wymagana'
          print('struct OK')
          "

  lint-bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S error app/AnberVc.sh scripts/install.sh
